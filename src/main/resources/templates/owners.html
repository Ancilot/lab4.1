
<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Владельцы автомобилей</title>
</head>
<body>

<div sec:authorize="isAuthenticated()">
    Авторизован как <b sec:authentication="name"></b>
    (<span sec:authentication="principal.authorities"></span>)

    <form th:action="@{/logout}" method="post" style="display:inline">
        <button type="submit">Выйти</button>
    </form>
</div>

<div sec:authorize="!isAuthenticated()">
    <a th:href="@{/login}">Войти</a>
</div>
<h1>Список владельцев автомобилей</h1>

<a sec:authorize="hasRole('ADMIN')" th:href="@{/owners/new}">Добавить владельца</a>
<br><br>

<a href="/cars">Перейти к автомобилям</a>

<table border="1" cellpadding="8">
    <thead>
    <tr>
        <th>ID</th>
        <th>Фамилия</th>
        <th>Имя</th>
        <th>Отчество</th>
        <th>Телефон</th>
        <th>Город</th>
        <th>Улица</th>
        <th>Количество автомобилей</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="owner : ${owners}">
        <td th:text="${owner.id}"></td>
        <td th:text="${owner.surname}"></td>
        <td th:text="${owner.name}"></td>
        <td th:text="${owner.patronymic}"></td>
        <td th:text="${owner.phone}"></td>
        <td th:text="${owner.address.city}"></td>
        <td th:text="${owner.address.street}"></td>
        <td th:text="${owner.cars.size()}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
